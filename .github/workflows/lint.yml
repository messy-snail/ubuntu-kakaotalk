name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Ensure shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          shellcheck --version

      - name: Check bash syntax
        run: |
          for script in install.sh docker/*.sh test/*.sh; do
            bash -n "$script"
            echo "syntax OK: $script"
          done

      - name: Run shellcheck
        run: shellcheck -x install.sh docker/*.sh test/*.sh
